services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      GANTRY_DB_URL: sqlite:////app/data/gantry.db
      GANTRY_CORS_ORIGINS: http://localhost:3000
      GANTRY_ENABLE_DEV_TOOLS: "false"
    volumes:
      - gantry-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  gantry-data:
